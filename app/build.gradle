plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.svoypage.svoilid'
    compileSdk 34

        signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    
    defaultConfig {
        applicationId "ru.svoypage.svoilid"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Material Design 3 (кнопки, карточки, нижняя навигация)
    implementation 'com.google.android.material:material:1.11.0'

    // AndroidX базовые
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment:1.6.2'

    // Защищённое хранилище для session_token
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Swipe-to-refresh
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // JSON (org.json уже есть в Android, но на всякий случай)
    // implementation 'org.json:json:20231013'
}
