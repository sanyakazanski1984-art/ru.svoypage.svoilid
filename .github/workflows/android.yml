name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Restore debug keystore from cache
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: debug.keystore
          key: svoi-lid-debug-keystore-v1

      - name: Generate debug keystore (only on first run)
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" -noprompt

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.5'
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: svoi-lid-debug
          path: app/build/outputs/apk/debug/app-debug.apk
